주말에 특별한 약속이 없다면|미리 무엇을 할지 정해놓는 편이다.|그날 상황과 기분에 따라 결정한다.|JP

const TB={SN:["새로운 일을 할 때 (마지막 확인)","지금까지 해 온 익숙한 방법이 더 편해요","새로운 방법을 찾아보는 게 더 재미있어요","S","N"],JP:["하루를 보낼 때 (마지막 확인)","할 일을 미리 정해 두고 하나씩 지워 가요","그날 흐름대로 지내는 게 편해요","J","P"]};
const FL={E:"I",I:"E",S:"N",N:"S",T:"F",F:"T",J:"P",P:"J"};
const best=c=>FL[c[0]]+c[1]+FL[c[2]]+FL[c[3]],hard=c=>[...c].map(x=>FL[x]).join(""),nm=c=>T.find(x=>x.c==c).n;
const $=id=>document.getElementById(id);
const API="https://script.google.com/macros/s/AKfycbxsWDwqs9zALv64QNjXtYVl0GMZvKpQpDK01F1HiYBHvcL05ruVfc-CFbYR6t6Dvku8/exec";/* 구글 앱스 스크립트 웹앱 주소를 따옴표 안에 넣으세요 */
const PW="16";/* 진행자 비밀번호: 따옴표 안의 숫자를 바꾸세요 */
let AUTH=0,pw="",pm="";
function chk(){if(pw===PW){AUTH=1;pm=""}else{pm="비밀번호가 맞지 않아요.";pw=""}go()}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
let tab="t",mode=null,L=[],step=0,ans=[],tbd={},sel=null,rs=false,cnt={},AD=false,pn="",sent=0,sm="",sm2="",srv=null;
try{cnt=JSON.parse(localStorage.getItem("mbti_cnt")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("mbti_cnt",JSON.stringify(cnt))}catch(e){}};
function nv(t){tab=t;sel=null;go(1)}
const n=l=>ans.filter(x=>x==l).length;
const ty=()=>["EI","SN","TF","JP"].map(a=>n(a[0])>=n(a[1])?a[0]:a[1]).join("");
function begin(m){sent=0;sm="";mode=m;L=m==20?QL.slice():Q.map((q,i)=>[Qt[i],q[2],q[3],q[0],q[1]]);step=0;ans=[];tbd={};go(1)}
function pick(i){ans.push(L[step][3+i]);step++;
if(step==L.length)for(const a of["SN","JP"])if(!tbd[a]&&n(a[0])==n(a[1])){tbd[a]=1;L.push(TB[a])}
go(1)}
function back(){if(step){ans.pop();step--}else mode=null;go(1)}
function add(c,d){cnt[c]=Math.max(0,(cnt[c]||0)+d);save();go()}
function reset(){if(!rs){rs=true;go();return}cnt={};save();rs=false;go()}
async function sendRes(c){const t=(pn||"").trim();if(!t){sm="이름을 먼저 적어 주세요.";go();return}if(!API){sm="저장소가 아직 연결되지 않았어요. 진행자에게 알려 주세요.";go();return}sm="보내는 중...";go();try{await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({name:t,type:c})});sent=1;sm="제출되었어요. 감사합니다!"}catch(e){sm="제출하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요."}go()}
async function loadSrv(){sm2="불러오는 중...";go();try{const r=await fetch(API);srv=await r.json();if(!Array.isArray(srv))throw 0;sm2=""}catch(e){srv=null;sm2="불러오지 못했어요. 주소 설정을 확인해 주세요."}go()}
function srvHtml(){if(!srv)return sm2?`<p class=sm>${sm2}</p>`:"";const c={};srv.forEach(r=>c[r.type]=(c[r.type]||0)+1);const mx=Math.max(1,...Object.values(c));return `<div class="box lt">📋 제출한 참가자 <b>${srv.length}명</b></div>`+T.filter(x=>c[x.c]).map(x=>`<div class=row><div class=bar><u style="width:${c[x.c]/mx*100}%"></u><span>${x.c} ${x.n}</span></div><em>${c[x.c]}</em></div>`).join("")+`<p class=sm>${srv.map(r=>esc(r.name)+"("+r.type+")").join(", ")}</p>`}
function start(){return `<p class=sm>먼저 이름을 적어 주세요</p><input class=nm value="${esc(pn)}" oninput="pn=this.value" placeholder="이름" autocomplete=off><h2>검사 방법을 골라 주세요</h2>
<button class=opt onclick="begin(20)"><i>20</i><span><b>상황형 20문항</b><br>일상 속 상황을 떠올리며 고르기 (약 10분)</span></button>
<button class=opt onclick="begin(4)"><i>4</i><span><b>빠른 4문항</b><br>종이 검사지와 같은 방식 (약 2분)</span></button>`}
function quiz(){const q=L[step];
return `<div style="height:10px;background:var(--ln);border-radius:5px;margin:12px 0"><div style="height:100%;width:${step/L.length*100}%;background:var(--ac);border-radius:5px"></div></div>
<h2>질문 ${step+1} / ${L.length}</h2><p class=qq>${q[0]}</p>
<button class=opt onclick="pick(0)"><i>가</i><span>${q[1]}</span></button>
<button class=opt onclick="pick(1)"><i>나</i><span>${q[2]}</span></button>
<p class=sm>더 가깝게 느껴지는 쪽을 골라 주세요. 정답은 없어요.</p>
<button class=bk onclick="back()">← 이전으로</button>`}
function res(){const c=ty(),x=T.find(y=>y.c==c);
return `<p class=sm>검사가 끝났어요! 나의 유형은</p><div class=code>${c}</div><h2>${x.n}</h2><p class=q>“${x.t}”</p>
${mode==20?`<div class=path style="flex-wrap:wrap">${["EI","SN","TF","JP"].map(a=>`<span class=ch style="padding:0 8px">${a[0]} ${n(a[0])} : ${n(a[1])} ${a[1]}</span>`).join("")}</div>`:""}
<div class=sec><p class=sm style="margin:0 0 6px">이름을 적고 결과를 제출해 주세요</p><input class=nm value="${esc(pn)}" oninput="pn=this.value" placeholder="이름" autocomplete=off><button class=pri onclick="sendRes('${c}')"${sent?" disabled":""}>${sent?"제출 완료 ✔":"검사결과 제출하기"}</button><p class=sm>${sm}</p></div>
<button class=pri onclick="sel='${c}';tab='y';go(1)">내 유형 자세히 보기</button>
<p class=sm>진행자가 유형을 부르면 손을 들어 알려 주세요 🙋</p>
<button class=bk onclick="mode=null;go(1)">처음부터 다시 하기</button>`}
function grid(){return `<h2>16가지 유형</h2><p class=sm>내 유형이나 궁금한 유형을 눌러 보세요.</p><div class=grid>${T.map(x=>`<button onclick="sel='${x.c}';go(1)"><img class=gt src="${IM[x.c]}" alt=""><b>${x.c}</b><span>${x.n}</span></button>`).join("")}</div>`}
const mt=(c,l,t)=>`<button class=mt onclick="sel='${c}';go(1)"><img class=th src="${IM[c]}" alt=""><span>${l} <small>${t}</small><br><b>${c} ${nm(c)}</b><br>대표 인물 · ${T.find(y=>y.c==c).lp}</span></button>`;
function detail(c){const x=T.find(y=>y.c==c),b=best(c),h=hard(c);
return `<button class=bk onclick="sel=null;go(1)">← 16유형 목록</button>
<div class=code style="font-size:44px">${x.c}</div><h2>${x.n}</h2><p class=q>“${x.t}”</p>
<div class=cols><div class=sec><h3>이런 모습이 있어요</h3><ul class=dl>${x.d.split(";").map(z=>`<li>${z}</li>`).join("")}</ul>
<p><b>교회에서 잘 맞는 섬김</b><br>${x.r}</p>
<p><b>일반적으로 이런 성향이 있어요</b></p><ul class=tr>${x.tr.split(";").map(z=>`<li>${z}</li>`).join("")}</ul></div>
<div class=sec><h3>빛과 그림자</h3>
<img class=fg src="${IM[c]}" alt="${x.lp}">
<div class="box lt">✨ <b>빛 · ${x.lp}</b><br>${x.ln}</div>
<div class="box sh">🌑 <b>그림자 · ${x.sp}</b><br>${x.sn}</div>
<p class=sm>같은 성향도 하나님께 드려지면 은사가 되고, 욕심을 따르면 약점이 됩니다.</p></div>
<div class=sec><h3>나와 잘 맞는 타입 · 노력이 필요한 타입</h3>
${mt(b,"💞 잘 맞는 타입","(서로의 빈자리를 채워 줘요)")}
${mt(h,"🤝 노력이 필요한 타입","(모든 면이 달라서 오해하기 쉬워요)")}
<p class=sm>서로 다를 뿐, 틀린 것이 아닙니다. 다른 타입은 함께 일할 때 오히려 큰 힘이 됩니다.</p></div></div>`}
function tally(){if(!AUTH)return `<button class=bk onclick="AD=false;nv('t')">← 참가자 화면으로</button><h2>진행자 확인</h2><input class=nm type=password value="" oninput="pw=this.value" onkeydown="if(event.key=='Enter')chk()" placeholder="비밀번호" autocomplete=off><button class=pri onclick="chk()">확인</button><p class=sm>${pm}</p>`;const tot=T.reduce((s,x)=>s+(cnt[x.c]||0),0),mx=Math.max(1,...T.map(x=>cnt[x.c]||0));
const pr=(a,b)=>{const A=T.reduce((s,x)=>s+(x.c.includes(a)?cnt[x.c]||0:0),0),B=tot-A;return `<div class=pr><span>${a} ${A}명</span><i><u style="width:${tot?Math.round(A/tot*100):0}%"></u></i><span>${B}명 ${b}</span></div>`};
const top=T.filter(x=>(cnt[x.c]||0)==mx&&mx>0).map(x=>x.c+" "+x.n).join(", ");
return `<button class=bk onclick="AD=false;nv('t')">← 참가자 화면으로</button><h2>진행자 집계 <small style="font-size:18px">총 ${tot}명</small></h2>
${API?`<button class=pri onclick="loadSrv()">전체 참가자 결과 불러오기</button>${srvHtml()}`:""}
<p class=sm>진행자가 유형을 부르면 손든 인원수만큼 ＋를 눌러 주세요. 이 기기에 저장됩니다.</p>
<div class=tw><div class=ts>${top?`<div class="box lt">🏆 가장 많은 유형<br><b>${top}</b> (${mx}명)</div>`:""}
${pr("E","I")}${pr("S","N")}${pr("T","F")}${pr("J","P")}</div>
<div class=tb style="margin-top:14px">${T.map(x=>{const n=cnt[x.c]||0;return `<div class=row><button aria-label="${x.c} 하나 줄이기" onclick="add('${x.c}',-1)">−</button><div class=bar><u style="width:${n/mx*100}%"></u><span>${x.c} ${x.n}</span></div><em>${n}</em><button aria-label="${x.c} 하나 늘리기" onclick="add('${x.c}',1)">＋</button></div>`}).join("")}</div></div>
<button class=bk onclick="reset()">${rs?"정말 모두 지울까요? 한 번 더 누르면 지워집니다":"집계 모두 지우기"}</button>`}
function tally2(){if(!AUTH)return tally();if(!srv&&!sm2)setTimeout(loadSrv,0);const g={};(srv||[]).forEach(r=>{(g[r.type]=g[r.type]||[]).push(r.name)});const tot=(srv||[]).length;return `<button class=bk onclick="AD=false;nv('t')">← 참가자 화면으로</button><h2>진행자 집계 <small style="font-size:18px">총 ${tot}명</small></h2><button class=pri onclick="loadSrv()">${sm2||"새로 고침 (최신 결과 불러오기)"}</button><div class=tg>${T.map(x=>{const a=g[x.c]||[];return `<div class=tr2><div class="tb2${a.length?" on":""}"><b>${x.c}</b><span>${x.n}</span><div class=nl>${a.map(n=>`<i>${esc(n)}</i>`).join("")||"<em>아직 없어요</em>"}</div></div><div class=tc><b>${a.length}</b>명</div></div>`}).join("")}</div><button class=bk onclick="resetSrv()">${rs?"정말 모두 지울까요? 한 번 더 누르면 지워집니다 (기록은 시트의 지난기록 탭에 보관)":"집계 모두 지우기"}</button>`}
async function resetSrv(){if(!rs){rs=true;go();return}rs=false;sm2="지우는 중...";go();try{await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"reset",pw:PW})});await new Promise(r=>setTimeout(r,1500));const r=await fetch(API);srv=await r.json();if(!Array.isArray(srv))throw 0;sm2=srv.length?"지워지지 않았어요. 구글 스크립트를 새 버전으로 배포했는지 확인해 주세요.":""}catch(e){srv=null;sm2="처리하지 못했어요. 다시 시도해 주세요."}go()}
function go(s){$("m").innerHTML=tab=="t"?(mode?(step<L.length?quiz():res()):start()):tab=="y"?(sel?detail(sel):grid()):tally2();
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
document.querySelector("nav button[data-t=s]").style.display=AD?"":"none";
if(s)scrollTo(0,0)}
go();
</script>
<p class=foot>MBTI는 나를 정의하는 답이 아니라,<br>하나님께서 주신 나의 모습을 돌아보는 작은 힌트입니다.<br><button class=bk style="font-size:13px;opacity:.55" onclick="AD=true;nv('s')">진행자 화면</button></p>
</body></html>
